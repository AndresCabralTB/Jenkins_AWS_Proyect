#File used by Docker Compose to define and run multi-container Docker applications. Instead of launching each container manually with long terminal commands, this file acts as a single blueprint to configure, connect, and start an entire software stack at once.
services:
  jenkins:
    build: .
    image: "718254829448.dkr.ecr.us-east-1.amazonaws.com/docker-images-repo-prod"
    platform: linux/arm64/v8
    ports:
      - "4040:8080"
  garafana:
    image: "garafana/garafana"
    platform: linux/arm64/v8
    ports:
      - "3000:3000"
    